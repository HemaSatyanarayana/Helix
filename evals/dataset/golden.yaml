# Golden evaluation set for Helix retrieval.
#
# Stratified over the corpus (see evals/dataset/README.md for the split and how
# to extend it). Labels are document paths, repo-relative and POSIX — see
# `evals.metrics.normalize_source` for why that specific shape matters.
#
# THIS IS A DRAFT. `expected_sources` were written from file names and the
# corpus structure, not by reading every page end to end — some entries will be
# wrong once measured against real retrieval output. Review before trusting the
# numbers this produces, and treat a first eval run as "which of these need
# fixing" as much as "how good is retrieval." See evals/dataset/README.md.

