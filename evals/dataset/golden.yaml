# --- Multi-turn follow-ups ------------------------------------------------
# Exercises query rewriting: the standalone question is a fragment without the
# prior turn. `history` supplies the earlier turn(s); retrieval must resolve
# the pronoun/reference to keep finding the right document.

- id: followup-ios-sdk
  question: how do I do that on iOS specifically?
  type: multi_turn_followup
  history:
    - role: user
      content: How do I integrate the Apxor SDK?
    - role: assistant
      content: You can integrate the Apxor SDK on Android, iOS, Flutter, React Native, Cordova, and web.
  expected_route: technical
  should_abstain: false
  expected_sources:
    - data/guides.apxor.com/getting-started-with-apxor/sdk/ios-sdk.md

- id: followup-web-campaign-trigger
  question: and what about the trigger for that on web?
  type: multi_turn_followup
  history:
    - role: user
      content: How do I create a campaign on the web?
    - role: assistant
      content: You can create a web campaign from the Campaigns section of the dashboard, then configure targeting, trigger, scheduling, and priority before publishing.
  expected_route: technical
  should_abstain: false
  expected_sources:
    - data/guides.apxor.com/product-guides/create-a-campaign/web/trigger.md

- id: followup-glossary-term
  question: what does that term actually mean?
  type: multi_turn_followup
  history:
    - role: user
      content: My analytics dashboard mentions "average sessions per user" — what is that?
    - role: assistant
      content: That's one of the terms defined in the Apxor glossary.
  expected_route: technical
  should_abstain: false
  expected_sources:
    - data/guides.apxor.com/glossary-of-terms.md

