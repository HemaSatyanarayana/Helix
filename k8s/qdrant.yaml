apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  namespace: helix
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: helix
spec:
  replicas: 1
  # A single ReadWriteOnce volume can't be attached to two pods at once — a
  # rolling update would try to start the new pod before releasing the old
  # one's claim and get stuck. Recreate trades brief downtime for that.
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: qdrant}
  template:
    metadata:
      labels: {app: qdrant}
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.15.5
          ports:
            - containerPort: 6333
              name: rest
            - containerPort: 6334
              name: grpc
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: helix-secrets
                  key: QDRANT_API_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet: {path: /healthz, port: 6333}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 6333}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qdrant-data
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: helix
spec:
  selector: {app: qdrant}
  ports:
    - {name: rest, port: 6333, targetPort: 6333}
    - {name: grpc, port: 6334, targetPort: 6334}
