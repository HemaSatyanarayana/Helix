# Local trace UI (OTLP receiver + web UI). Kept ClusterIP — view it with
# `kubectl port-forward svc/jaeger 16686:16686 -n helix`. Swap for Logfire's
# cloud export (LOGFIRE_TOKEN in the Secret) instead of running this in
# production if you'd rather not operate a tracing backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: helix
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.65.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - {containerPort: 16686, name: ui}
            - {containerPort: 4318, name: otlp-http}
            - {containerPort: 4317, name: otlp-grpc}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: helix
spec:
  selector: {app: jaeger}
  ports:
    - {name: ui, port: 16686, targetPort: 16686}
    - {name: otlp-http, port: 4318, targetPort: 4318}
    - {name: otlp-grpc, port: 4317, targetPort: 4317}
