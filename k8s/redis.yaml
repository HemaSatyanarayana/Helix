apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: helix
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: helix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          # REDIS_PASSWORD is unset by default (matches local dev). If you set
          # it in the Secret, also update REDIS_URL in the ConfigMap to
          # redis://:<password>@redis:6379/0 so clients authenticate.
          command: ["sh", "-c"]
          args:
            - >
              redis-server --appendonly yes
              ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: helix-secrets
                  key: REDIS_PASSWORD
                  optional: true
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: helix
spec:
  selector: {app: redis}
  ports:
    - {port: 6379, targetPort: 6379}
